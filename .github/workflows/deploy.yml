name: Deploy Backend to ECS

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch:    # allow manual trigger from GitHub UI

env:
  AWS_REGION:      ap-south-1
  ECR_REPO_NAME:   ledgerly-backend
  ECS_CLUSTER:     ledgerly-cluster
  ECS_SERVICE:     ledgerly-service
  CONTAINER_NAME:  ledgerly-backend

jobs:
  deploy:
    name: Build → Push ECR → Redeploy ECS
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # needed if you switch to OIDC auth in the future

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Log in to ECR ──────────────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build and push Docker image ────────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO_NAME"

          echo "Building image..."
          docker build \
            --build-arg SECRET_KEY=build-time-dummy-not-used-in-production \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            ./backend

          echo "Pushing image..."
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ── 5. Update ECS task definition with new image ──────────────────────────
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ledgerly-task \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-def.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ steps.build-image.outputs.image }}

      # ── 6. Deploy to ECS ──────────────────────────────────────────────────────
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          service:          ${{ env.ECS_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── 7. Print the task's public IP ─────────────────────────────────────────
      - name: Get backend public IP
        run: |
          echo "Waiting for task to get a public IP..."
          sleep 15

          TASK_ARN=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --query 'taskArns[0]' --output text)

          echo "Task ARN: $TASK_ARN"

          ENI_ID=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Backend is live at: http://$PUBLIC_IP:8000"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "⚠️  The IP changes on every redeploy."
          echo "   Update GitHub secret BACKEND_URL with: http://$PUBLIC_IP:8000"
          echo "   (Settings → Secrets → BACKEND_URL)"
